[project]
name = "better-meeting"
version = "0.2.0"
description = "Turn a screen-share meeting recording into a self-contained folder of artifacts (transcript, timeline, selected screenshots, ready-to-paste prompt) you can drop into a chatbot."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Oleksii Moshura", email = "alexey.givenfly.moshura@gmail.com" }]
keywords = ["meeting", "transcription", "whisper", "ocr", "screenshots", "ffmpeg", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin'",
    "pillow>=12.3.0",
    "pyobjc-framework-vision>=12.2.1 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Non-macOS ASR backend. Enable with: pip install "better-meeting[faster]"
faster = ["faster-whisper>=1.0.0"]
# Alternative summarizer backend (`--llm litellm`).
litellm = ["litellm>=1.40.0"]

[project.scripts]
bm = "better_meeting.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/better-meeting"
Repository = "https://github.com/your-org/better-meeting"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["better_meeting"]
